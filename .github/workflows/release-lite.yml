name: Release Lite Binaries

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

concurrency:
  # All releases update the same Homebrew formula on main, so serialize the
  # complete workflow across tags to avoid competing pushes.
  group: release-lite
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  WAILS_VERSION: "v2.12.0"
  GOTOOLCHAIN: local
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Validate the requested immutable source before any build starts. A release
  # tag must already exist and every user-visible version file must agree with
  # it, otherwise archives could be named for code they do not contain.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and versions
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tag must be a v-prefixed semantic version without build metadata: $RELEASE_TAG"
            exit 1
          fi

          # Chart.appVersion is also the first-party Docker image tag. Build
          # metadata uses '+', which is invalid in Docker tags, so it is not a
          # supported release identifier. Numeric prerelease identifiers must
          # also follow SemVer's no-leading-zero rule.
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease="${RELEASE_TAG#*-}"
            IFS='.' read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != "0" && "$identifier" == 0* ]]; then
                echo "::error::Numeric prerelease identifiers cannot contain leading zeroes: $RELEASE_TAG"
                exit 1
              fi
            done
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Release ref is not an existing tag: $RELEASE_TAG"
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$release_sha" != "$tag_sha" ]; then
            echo "::error::Checked-out commit $release_sha is not tag $RELEASE_TAG ($tag_sha)"
            exit 1
          fi

          version="$(tr -d '\r\n' < VERSION)"
          expected_tag="v${version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Tag $RELEASE_TAG does not match VERSION ($expected_tag)"
            exit 1
          fi
          python3 scripts/check-product-version.py

          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "sha=$release_sha"
          } >> "$GITHUB_OUTPUT"

  # ── 1. Build frontend once, share as artifact (for Web CLI) ──
  build-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  # ── 2a. Build Web CLI binary per platform (native CGO) ──
  build-binary:
    needs: [prepare, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/

      - name: Build
        run: |
          export EDITION=lite
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="-w -s $(./scripts/get_version.sh ldflags)"
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"
          fi
          go build -tags "sqlite_fts5" -ldflags="${LDFLAGS}" \
            -o WeKnora-lite ./cmd/server
          go build -tags "sqlite_fts5" -o weknora-migrate ./cmd/migrate-runner

          build_info="$(go version -m WeKnora-lite)"
          if ! grep -Fq "GOOS=${GOOS}" <<< "$build_info" || \
             ! grep -Fq "GOARCH=${GOARCH}" <<< "$build_info"; then
            echo "::error::Binary target does not match ${GOOS}/${GOARCH}"
            printf '%s\n' "$build_info"
            exit 1
          fi

      - name: Package tarball
        run: |
          ARCHIVE="WeKnora-lite_${RELEASE_TAG}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "${ARCHIVE}/web"
          cp WeKnora-lite weknora-migrate "${ARCHIVE}/"
          cp -r web/* "${ARCHIVE}/web/"
          cp .env.lite.example "${ARCHIVE}/"
          cp docs/LITE.md "${ARCHIVE}/README.md"
          if [ -d config ]; then
            cp -r config "${ARCHIVE}/config"
          fi
          mkdir -p "${ARCHIVE}/migrations"
          for migration_chain in versioned sqlite topic3/postgres topic3/sqlite; do
              test -d "migrations/$migration_chain"
              mkdir -p "${ARCHIVE}/migrations/$migration_chain"
              cp -r "migrations/$migration_chain/." "${ARCHIVE}/migrations/$migration_chain/"
          done
          if [ -f deploy/weknora-lite.service ]; then
            cp deploy/weknora-lite.service "${ARCHIVE}/"
          fi
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            WeKnora-lite_*.tar.gz
            WeKnora-lite_*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  # ── 2b. Build Desktop APP per platform (Wails) ──
  build-desktop-app:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin/universal
            arch_label: macOS_universal
            artifact_name: desktop-macos-universal
          - os: macos-15-intel
            platform: darwin/amd64
            arch_label: macOS_amd64
            artifact_name: desktop-macos-amd64
          - os: macos-15
            platform: darwin/arm64
            arch_label: macOS_arm64
            artifact_name: desktop-macos-arm64
          - os: ubuntu-latest
            platform: linux/amd64
            arch_label: linux_amd64
            artifact_name: desktop-linux-amd64
          - os: windows-latest
            platform: windows/amd64
            arch_label: windows_amd64
            artifact_name: desktop-windows-amd64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Build desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations"

          BUILD_TAGS="sqlite_fts5"
          NSIS_FLAG=""

          if [ "${{ runner.os }}" = "Linux" ]; then
            BUILD_TAGS="sqlite_fts5 webkit2_41"
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CGO_LDFLAGS="-Wl,-no_warn_duplicate_libraries"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            NSIS_FLAG="-nsis"
          fi

          cd cmd/desktop
          wails build -clean \
            -tags "${BUILD_TAGS}" \
            -platform "${{ matrix.platform }}" \
            ${NSIS_FLAG} \
            -ldflags="${LDFLAGS}" \
            -o "WeKnora Lite"

      # ── macOS: bundle .app with resources, then create DMG ──
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          APP_BUNDLE="WeKnora Lite.app"
          SRC="cmd/desktop/build/bin/${APP_BUNDLE}"
          RESOURCES="${SRC}/Contents/Resources"

          mkdir -p "${RESOURCES}/config"
          go build -tags "sqlite_fts5" -o "${RESOURCES}/weknora-migrate" ./cmd/migrate-runner

          if [ -f .env.lite.example ]; then
            cp .env.lite.example "${RESOURCES}/.env"
          fi
          mkdir -p "${RESOURCES}/migrations"
          for migration_chain in versioned sqlite topic3/postgres topic3/sqlite; do
              test -d "migrations/$migration_chain"
              mkdir -p "${RESOURCES}/migrations/$migration_chain"
              cp -r "migrations/$migration_chain/." "${RESOURCES}/migrations/$migration_chain/"
          done
          if [ -d config ]; then
            cp -r config/* "${RESOURCES}/config/"
          fi

          DMG_NAME="WeKnora-Lite-App_${RELEASE_TAG}_${{ matrix.arch_label }}"

          DMG_SRC="dmg_staging"
          mkdir -p "${DMG_SRC}"
          cp -R "cmd/desktop/build/bin/${APP_BUNDLE}" "${DMG_SRC}/"
          ln -s /Applications "${DMG_SRC}/Applications"

          hdiutil create -volname "WeKnora Lite" \
            -srcfolder "${DMG_SRC}" \
            -ov -format UDZO \
            "${DMG_NAME}.dmg"

          shasum -a 256 "${DMG_NAME}.dmg" > "${DMG_NAME}.dmg.sha256"

      # ── Linux: package tarball ──
      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          ARCHIVE="WeKnora-Lite-App_${RELEASE_TAG}_${{ matrix.arch_label }}"
          mkdir -p "${ARCHIVE}"
          cp "cmd/desktop/build/bin/WeKnora Lite" "${ARCHIVE}/"
          go build -tags "sqlite_fts5" -o "${ARCHIVE}/weknora-migrate" ./cmd/migrate-runner
          if [ -f .env.lite.example ]; then
            cp .env.lite.example "${ARCHIVE}/"
          fi
          cp docs/LITE.md "${ARCHIVE}/README.md"
          if [ -d config ]; then
            cp -r config "${ARCHIVE}/config"
          fi
          mkdir -p "${ARCHIVE}/migrations"
          for migration_chain in versioned sqlite topic3/postgres topic3/sqlite; do
              test -d "migrations/$migration_chain"
              mkdir -p "${ARCHIVE}/migrations/$migration_chain"
              cp -r "migrations/$migration_chain/." "${ARCHIVE}/migrations/$migration_chain/"
          done
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      # ── Windows: package NSIS installer or plain exe ──
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARCHIVE="WeKnora-Lite-App_${RELEASE_TAG}_${{ matrix.arch_label }}"
          # Wails -nsis generates an installer named {app}-amd64-installer.exe
          INSTALLER="cmd/desktop/build/bin/WeKnora Lite-amd64-installer.exe"
          if [ ! -f "$INSTALLER" ]; then
            echo "::error::Wails did not produce the required NSIS installer: $INSTALLER"
            find cmd/desktop/build/bin -maxdepth 1 -type f -print
            exit 1
          fi
          cp "$INSTALLER" "${ARCHIVE}_setup.exe"
          sha256sum "${ARCHIVE}_setup.exe" > "${ARCHIVE}_setup.exe.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            WeKnora-Lite-App_*.dmg
            WeKnora-Lite-App_*.dmg.sha256
            WeKnora-Lite-App_*.tar.gz
            WeKnora-Lite-App_*.tar.gz.sha256
            WeKnora-Lite-App_*.exe
            WeKnora-Lite-App_*.exe.sha256
          if-no-files-found: error
          retention-days: 3

  # ── 3. Create GitHub Release ──
  release:
    needs: [prepare, build-binary, build-desktop-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      EXPECTED_RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate immutable release tag
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$checkout_sha" != "$EXPECTED_RELEASE_SHA" ] || [ "$tag_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::Release tag moved after prepare: expected $EXPECTED_RELEASE_SHA, checkout=$checkout_sha, tag=$tag_sha"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          cat > notes.md << 'NOTES'
          ## WeKnora Lite ${{ needs.prepare.outputs.tag }}

          ### Web CLI 版（命令行 / 服务器部署）

          单二进制部署，零外部依赖（无需 Docker / PostgreSQL / Redis）。

          ```bash
          # 1. 解压
          tar xzf WeKnora-lite_${{ needs.prepare.outputs.tag }}_<os>_<arch>.tar.gz
          cd WeKnora-lite_${{ needs.prepare.outputs.tag }}_<os>_<arch>

          # 2. 配置
          cp .env.lite.example .env.lite
          # 编辑 .env.lite，至少确认 OLLAMA_BASE_URL 正确

          # 3. 启动 Ollama（如尚未运行）
          ollama serve &
          ollama pull qwen2.5:7b
          ollama pull nomic-embed-text

          # 4. 运行
          set -a && source .env.lite && set +a
          ./WeKnora-lite
          # 访问 http://localhost:8080
          ```

          | 文件 | 平台 |
          |------|------|
          | `WeKnora-lite_*_linux_amd64.tar.gz` | Linux x86_64 |
          | `WeKnora-lite_*_linux_arm64.tar.gz` | Linux ARM64 |
          | `WeKnora-lite_*_darwin_amd64.tar.gz` | macOS Intel |
          | `WeKnora-lite_*_darwin_arm64.tar.gz` | macOS Apple Silicon |

          ---

          ### 桌面 APP 版（开箱即用，无需命令行）

          原生桌面应用，内置 Web 服务，双击即可运行。

          | 文件 | 平台 |
          |------|------|
          | `WeKnora-Lite-App_*_macOS_universal.dmg` | macOS (Intel + Apple Silicon) |
          | `WeKnora-Lite-App_*_macOS_amd64.dmg` | macOS Intel |
          | `WeKnora-Lite-App_*_macOS_arm64.dmg` | macOS Apple Silicon |
          | `WeKnora-Lite-App_*_linux_amd64.tar.gz` | Linux x86_64 |
          | `WeKnora-Lite-App_*_windows_amd64_setup.exe` | Windows x86_64 (安装包) |

          详细文档见 [LITE.md](docs/LITE.md)。
          NOTES

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          web_archives=(WeKnora-lite_*.tar.gz)
          web_checksums=(WeKnora-lite_*.tar.gz.sha256)
          desktop_packages=(WeKnora-Lite-App_*.dmg WeKnora-Lite-App_*.tar.gz WeKnora-Lite-App_*.exe)
          desktop_checksums=(WeKnora-Lite-App_*.sha256)

          if [ "${#web_archives[@]}" -ne 4 ] || [ "${#web_checksums[@]}" -ne 4 ] || \
             [ "${#desktop_packages[@]}" -ne 5 ] || [ "${#desktop_checksums[@]}" -ne 5 ]; then
            echo "::error::Unexpected release asset set: web=${#web_archives[@]}/${#web_checksums[@]}, desktop=${#desktop_packages[@]}/${#desktop_checksums[@]}"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release or draft $RELEASE_TAG already exists; refusing to replace immutable assets"
            exit 1
          fi

          assets=("${web_archives[@]}" "${web_checksums[@]}" "${desktop_packages[@]}" "${desktop_checksums[@]}")
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "WeKnora Lite $RELEASE_TAG" \
            --notes-file notes.md \
            "${assets[@]}"

          asset_count="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          if [ "$asset_count" -ne 18 ]; then
            echo "::error::Release $RELEASE_TAG contains $asset_count assets; expected 18"
            exit 1
          fi

          # Keep partially uploaded releases private. Publish only after the
          # complete immutable asset contract has been verified.
          gh release edit "$RELEASE_TAG" --draft=false
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "::error::Release $RELEASE_TAG remained a draft after publication"
            exit 1
          fi

  # ── 4. Update Homebrew Formula ──
  update-homebrew:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for release assets to be available
        run: sleep 15

      - name: Update Formula
        run: ./scripts/update-homebrew-formula.sh "$RELEASE_TAG"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/weknora-lite.rb
          if git diff --cached --quiet; then
            echo "No changes to Formula"
          else
            git commit -m "formula: update weknora-lite to $RELEASE_TAG"
            git push origin main
          fi
