name: Evaluation regression

on:
  pull_request:
    paths:
      - "cmd/evaluation-reproduce/**"
      - "dataset/golden/**"
      - "evaluation/regression/**"
      - "internal/application/service/metric/**"
      - "internal/evaluation/**"
      - "internal/types/evaluation*.go"
      - "Makefile"
      - ".github/workflows/evaluation-regression.yml"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOPROXY: https://proxy.golang.org,direct
  LOG_FORMAT: ""

jobs:
  regression:
    name: Deterministic golden evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run the reproducible evaluation gate
        run: make evaluation-reproduce

      - name: Upload authoritative and rendered reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-regression-${{ github.run_id }}
          path: artifacts/evaluation-regression/
          if-no-files-found: error
