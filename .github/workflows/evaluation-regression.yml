name: Evaluation regression

on:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  CGO_ENABLED: "1"
  GOPROXY: https://proxy.golang.org,direct
  LOG_FORMAT: ""

jobs:
  regression:
    name: Deterministic golden evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run the reproducible evaluation gate
        run: make evaluation-reproduce

      - name: Run persistent HTTP evaluation and cache rebuild
        run: python3 scripts/evaluation-rag-http-smoke.py --output artifacts/evaluation-rag-http

      - name: Check product version consistency
        run: python3 scripts/check-product-version.py

      - name: Upload authoritative and rendered reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-regression-${{ github.run_id }}
          path: |
            artifacts/evaluation-regression/
            artifacts/evaluation-rag-http/
          if-no-files-found: error
